# Entidade deste repositório no Backstage (toggle-master-backstage).
# As anotações ligam as abas do portal: pipelines (GitHub Actions), pods
# (Kubernetes, nos clusters no ar), deploy por ambiente (Argo CD) e docs
# (TechDocs, a partir do mkdocs.yml).
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: auth-service
  description: Cria e valida as chaves de API (Bearer) usadas pelos outros serviços.
  tags:
    - go
  annotations:
    github.com/project-slug: FIAP-PosTech-DevOps/auth-service
    backstage.io/techdocs-ref: dir:.
    backstage.io/kubernetes-namespace: auth-service
    backstage.io/kubernetes-label-selector: app=auth-service
    argocd/app-name: auth-service
  links:
    - url: https://github.com/FIAP-PosTech-DevOps/toggle-master-gitops/tree/main/apps/auth-service
      title: Manifestos (GitOps)
      icon: github
spec:
  type: service
  lifecycle: production
  owner: group:grupo-fase3
  system: togglemaster
  dependsOn:
    - resource:default/auth-db
